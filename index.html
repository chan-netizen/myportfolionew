  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r:blur(12px);border:0.5px solid var(--border,rgba(255,255,255,0.12));border-radius:10px;padding:20px;display:flex;gap:14px;align-items:flex-start\"><span style=\"font-size:20px;line-height:1\">⭐<\u002Fspan><span style=\"font-size:14px;color:var(--text,#F0EDE6);line-height:1.6\">Sales Rockstar Award — Zomato, top of cohort 2 consecutive months<\u002Fspan><\u002Fdiv>\n      <div style=\"background:var(--card,rgba(20,8,40,0.6));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0.5px solid var(--border,rgba(255,255,255,0.12));border-radius:10px;padding:20px;display:flex;gap:14px;align-items:flex-start\"><span style=\"font-size:20px;line-height:1\">🏆<\u002Fspan><span style=\"font-size:14px;color:var(--text,#F0EDE6);line-height:1.6\">UC Champ Award — Urban Company, peak-season category growth<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- OPERATING PRINCIPLES -->\n<section style=\"background:var(--overlay,rgba(10,2,21,0.75));padding:80px 40px;border-top:0.5px solid var(--divider,rgba(255,255,255,0.1))\">\n  <div style=\"max-width:900px;margin:0 auto\">\n    <p style=\"margin:0 0 40px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--accent,#C97B3F)\">How I work<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:40px\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent,#C97B3F);margin-bottom:12px\">01<\u002Fdiv>\n        <h3 style=\"margin:0 0 12px;font-weight:500;font-size:16px;color:var(--text,#F0EDE6)\">Structure the problem before solving it.<\u002Fh3>\n        <p style=\"margin:0 0 18px;font-size:14px;color:var(--text2,#9AA087);line-height:1.7\">Ambiguity is not an obstacle — it is the first thing to resolve. Every engagement, account, and project starts with defining what the real problem actually is before any solution is proposed.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <div style=\"flex:1;height:3px;background:var(--border,rgba(255,255,255,0.12));border-radius:2px;overflow:hidden\"><div style=\"width:90%;height:100%;background:var(--accent,#C97B3F)\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent,#C97B3F)\">Conviction 9/10<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent,#C97B3F);margin-bottom:12px\">02<\u002Fdiv>\n        <h3 style=\"margin:0 0 12px;font-weight:500;font-size:16px;color:var(--text,#F0EDE6)\">Operators make better consultants.<\u002Fh3>\n        <p style=\"margin:0 0 18px;font-size:14px;color:var(--text2,#9AA087);line-height:1.7\">The best frameworks are useless without someone who has run the numbers, managed the partners, and felt the pressure of a missed target. That experience is the lens I bring to every problem.<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <div style=\"flex:1;height:3px;background:var(--border,rgba(255,255,255,0.12));border-radius:2px;overflow:hidden\"><div style=\"width:100%;height:100%;background:var(--accent,#C97B3F)\"><\u002Fdiv><\u002Fdiv>\n          <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent,#C97B3F)\">Conviction 10/10<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- THE OFFER -->\n<section style=\"background:var(--overlay,rgba(10,2,21,0.75));padding:96px 40px;border-top:0.5px solid var(--divider,rgba(255,255,255,0.1))\">\n  <div style=\"max-width:760px;margin:0 auto;text-align:center\">\n    <p style=\"margin:0 0 30px;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--accent,#C97B3F)\">The offer<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:34px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text,#F0EDE6);background:var(--pill,rgba(201,123,63,0.15));border:0.5px solid var(--border,rgba(255,255,255,0.12));border-radius:20px;padding:8px 18px\"><span style=\"color:var(--accent,#C97B3F)\">AVAILABILITY<\u002Fspan> · Full-time from Oct 2026<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text,#F0EDE6);background:var(--pill,rgba(201,123,63,0.15));border:0.5px solid var(--border,rgba(255,255,255,0.12));border-radius:20px;padding:8px 18px\"><span style=\"color:var(--accent,#C97B3F)\">GEOGRAPHY<\u002Fspan> · UAE · India · Global<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text,#F0EDE6);background:var(--pill,rgba(201,123,63,0.15));border:0.5px solid var(--border,rgba(255,255,255,0.12));border-radius:20px;padding:8px 18px\"><span style=\"color:var(--accent,#C97B3F)\">STATUS<\u002Fspan> · Open to projects now<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center\">\n      <a href=\"mailto:chanakyahemanth08@gmail.com\" style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--accent,#C97B3F)\">chanakyahemanth08@gmail.com<\u002Fa>\n      <a href=\"https://www.linkedin.com/in/chanakya-balele-hemanth-b74709244/\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px;font-weight:500;color:var(--accent,#C97B3F);background:transparent;border:0.5px solid var(--accent,#C97B3F);padding:10px 20px;border-radius:4px\">LinkedIn<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"background:var(--overlay,rgba(10,2,21,0.75));padding:44px 40px;border-top:0.5px solid var(--divider,rgba(255,255,255,0.1))\">\n  <div style=\"max-width:900px;margin:0 auto;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text2,#9AA087)\">\n    © 2026 Chanakya B H · Dubai, UAE · <a href=\"https://www.linkedin.com/in/chanakya-balele-hemanth-b74709244/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--accent,#C97B3F)\">LinkedIn<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<!-- CONNECT MODAL -->\n<div style=\"{{ overlayStyle }}\" sc-camel-on-click=\"{{ close }}\">\n  <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%;max-width:480px;background:var(--card,rgba(20,8,40,0.6));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:0.5px solid var(--border,rgba(255,255,255,0.12));border-radius:12px;padding:40px;position:relative\">\n    <button sc-camel-on-click=\"{{ close }}\" aria-label=\"Close\" style=\"position:absolute;top:16px;right:16px;width:32px;height:32px;cursor:pointer;background:transparent;border:none;color:var(--text2,#9AA087);font-size:20px;line-height:1;font-family:inherit\">×<\u002Fbutton>\n\n    <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n      <div>\n        <h3 style=\"margin:0 0 6px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:28px;color:var(--text,#F0EDE6)\">Connect with me<\u002Fh3>\n        <p style=\"margin:0 0 26px;font-size:13px;color:var(--text2,#9AA087)\">Tell me a little about you and I'll be in touch.<\u002Fp>\n        <form sc-camel-on-submit=\"{{ submit }}\">\n          <label style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent,#C97B3F);margin-bottom:7px\">Full Name<\u002Flabel>\n          <input name=\"name\" type=\"text\" required=\"\" placeholder=\"Your name\" style=\"width:100%;margin-bottom:18px;padding:10px 14px;font-family:inherit;font-size:14px;color:var(--text,#F0EDE6);background:var(--overlay,rgba(10,2,21,0.75));border:0.5px solid var(--border,rgba(255,255,255,0.12));border-radius:4px;outline:none\">\n          <label style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent,#C97B3F);margin-bottom:7px\">Email Address<\u002Flabel>\n          <input name=\"email\" type=\"email\" required=\"\" placeholder=\"you@example.com\" style=\"width:100%;margin-bottom:18px;padding:10px 14px;font-family:inherit;font-size:14px;color:var(--text,#F0EDE6);background:var(--overlay,rgba(10,2,21,0.75));border:0.5px solid var(--border,rgba(255,255,255,0.12));border-radius:4px;outline:none\">\n          <label style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent,#C97B3F);margin-bottom:7px\">Phone Number<\u002Flabel>\n          <input name=\"phone\" type=\"tel\" placeholder=\"+971 ...\" style=\"width:100%;margin-bottom:22px;padding:10px 14px;font-family:inherit;font-size:14px;color:var(--text,#F0EDE6);background:var(--overlay,rgba(10,2,21,0.75));border:0.5px solid var(--border,rgba(255,255,255,0.12));border-radius:4px;outline:none\">\n          <label style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent,#C97B3F);margin-bottom:11px\">Open to Relocate<\u002Flabel>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px\">\n            <sc-for list=\"{{ relocateOptions }}\" as=\"opt\" hint-placeholder-count=\"5\">\n              <button type=\"button\" sc-camel-on-click=\"{{ opt.toggle }}\" style=\"{{ opt.style }}\">{{ opt.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ error }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0 0 14px;font-size:12.5px;color:#e08a6b\">Something went wrong sending your message. Please try again.<\u002Fp>\n          <\u002Fsc-if>\n          <button type=\"submit\" style=\"width:100%;margin-top:4px;padding:13px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;color:#0a0215;background:var(--accent,#C97B3F);border:none;border-radius:4px\">Send Message<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:20px 0\">\n        <div style=\"width:52px;height:52px;margin:0 auto 20px;border:0.5px solid var(--accent,#C97B3F);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent,#C97B3F);font-size:24px\">✓<\u002Fdiv>\n        <h3 style=\"margin:0 0 10px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;color:var(--accent,#C97B3F)\">Message Sent<\u002Fh3>\n        <p style=\"margin:0 0 24px;font-size:14px;line-height:1.6;color:var(--text2,#9AA087)\">Thank you for reaching out. I'll get back to you shortly.<\u002Fp>\n        <button sc-camel-on-click=\"{{ close }}\" style=\"cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--accent,#C97B3F);background:transparent;border:0.5px solid var(--accent,#C97B3F);padding:10px 24px;border-radius:4px\">Close<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { modalOpen:false, submitted:false, error:false, relocate:[], theme:'dark' };\n\n  componentDidMount(){\n    try { const saved = localStorage.getItem('theme'); if (saved === 'light' || saved === 'dark') this.setState({ theme: saved }); } catch(e){}\n    this._esc = (e) => { if (e.key === 'Escape') this.close(); };\n    window.addEventListener('keydown', this._esc);\n    this.startBg();\n  }\n  componentWillUnmount(){\n    if (this._esc) window.removeEventListener('keydown', this._esc);\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n  }\n\n  toggleTheme(){\n    this.setState(s => {\n      const t = s.theme === 'dark' ? 'light' : 'dark';\n      try { localStorage.setItem('theme', t); } catch(e){}\n      return { theme: t };\n    });\n  }\n\n  startBg(){\n    const canvas = this.canvas;\n    if (!canvas) return;\n    const ctx = canvas.getContext('2d');\n    let w, h, dpr;\n    const cols = ['#1a0533', '#6b1040', '#8B4513', '#0a0215'];\n    const blobs = [\n      { c:'#6b1040', ax:0.30, ay:0.28, r:0.62, sx:0.11, sy:0.08, ph:0.0 },\n      { c:'#1a0533', ax:0.26, ay:0.24, r:0.70, sx:0.08, sy:0.12, ph:1.7 },\n      { c:'#8B4513', ax:0.34, ay:0.22, r:0.50, sx:0.13, sy:0.09, ph:3.1 },\n      { c:'#6b1040', ax:0.22, ay:0.30, r:0.55, sx:0.09, sy:0.11, ph:4.6 },\n      { c:'#8B4513', ax:0.30, ay:0.26, r:0.45, sx:0.12, sy:0.07, ph:5.9 }\n    ];\n    const resize = () => {\n      dpr = Math.min(window.devicePixelRatio || 1, 2);\n      w = window.innerWidth; h = window.innerHeight;\n      canvas.width = w * dpr; canvas.height = h * dpr;\n      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    };\n    resize();\n    this._onResize = resize;\n    window.addEventListener('resize', this._onResize);\n\n    const TAU = Math.PI * 2;\n    // slow-moving wavy colour bands\n    const waves = [\n      { c:'#1a0533', base:0.30, amp:0.10, len:1.1, sp:0.75, ph:0.0, a:0.85 },\n      { c:'#6b1040', base:0.50, amp:0.13, len:0.8, sp:0.58, ph:1.6, a:0.70 },\n      { c:'#8B4513', base:0.68, amp:0.10, len:1.4, sp:0.92, ph:3.2, a:0.55 },\n      { c:'#6b1040', base:0.86, amp:0.14, len:0.9, sp:0.68, ph:4.7, a:0.60 }\n    ];\n    let t = 0;\n    const draw = () => {\n      t += 0.016;\n      ctx.globalCompositeOperation = 'source-over';\n      ctx.fillStyle = '#0a0215';\n      ctx.fillRect(0, 0, w, h);\n      ctx.globalCompositeOperation = 'lighter';\n      for (const wv of waves){\n        const yb = h * wv.base;\n        const g = ctx.createLinearGradient(0, yb - h * 0.34, 0, yb + h * 0.34);\n        g.addColorStop(0, this.hexA(wv.c, 0));\n        g.addColorStop(0.5, this.hexA(wv.c, wv.a));\n        g.addColorStop(1, this.hexA(wv.c, 0));\n        ctx.fillStyle = g;\n        ctx.beginPath();\n        ctx.moveTo(0, h + 10);\n        const step = Math.max(16, w / 60);\n        for (let x = 0; x <= w; x += step){\n          const y = yb\n            + Math.sin(x / (w * wv.len) * TAU + t * wv.sp + wv.ph) * (h * wv.amp)\n            + Math.sin(x / (w * wv.len * 0.5) * TAU - t * wv.sp * 0.7 + wv.ph) * (h * wv.amp * 0.4);\n          ctx.lineTo(x, y);\n        }\n        ctx.lineTo(w, h + 10);\n        ctx.closePath();\n        ctx.fill();\n      }\n      ctx.globalCompositeOperation = 'source-over';\n      this._raf = requestAnimationFrame(draw);\n    };\n    draw();\n  }\n  hexA(hex, a){\n    const n = parseInt(hex.slice(1), 16);\n    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';\n  }\n\n  open(){ this.setState({ modalOpen:true, submitted:false, error:false }); }\n  close(){ this.setState({ modalOpen:false }); }\n  toggle(label){\n    this.setState(s => ({ relocate: s.relocate.includes(label) ? s.relocate.filter(x => x !== label) : [...s.relocate, label] }));\n  }\n  async submit(e){\n    e.preventDefault();\n    const f = e.target;\n    const payload = {\n      access_key: '3fd0f2ba-1414-44ca-bba4-0fa6f797e665',\n      name: f.name.value, email: f.email.value, phone: f.phone.value,\n      relocate: this.state.relocate.join(', '),\n      subject: 'New portfolio contact — ' + f.name.value,\n      from_name: 'Chanakya Portfolio'\n    };\n    try {\n      const res = await fetch('https://api.web3forms.com/submit', {\n        method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },\n        body: JSON.stringify(payload)\n      });\n      const data = await res.json().catch(() => ({}));\n      if (res.ok && data.success !== false) this.setState({ submitted:true, error:false });\n      else this.setState({ error:true });\n    } catch (err) { this.setState({ error:true }); }\n  }\n\n  renderVals(){\n    const dark = this.state.theme === 'dark';\n    const vars = dark ? {\n      '--text':'#F0EDE6', '--text2':'#9AA087', '--accent':'#C97B3F',\n      '--border':'rgba(255,255,255,0.12)', '--card':'rgba(20,8,40,0.6)',\n      '--pill':'rgba(201,123,63,0.15)', '--overlay':'rgba(10,2,21,0.75)',\n      '--divider':'rgba(255,255,255,0.1)', '--nav':'rgba(10,2,21,0.7)'\n    } : {\n      '--text':'#1A1A1A', '--text2':'#5C5C5C', '--accent':'#1C3B2F',\n      '--border':'#D4CFC6', '--card':'#EDEAE3',\n      '--pill':'rgba(28,59,47,0.10)', '--overlay':'rgba(245,242,237,0.85)',\n      '--divider':'#D4CFC6', '--nav':'rgba(245,242,237,0.85)'\n    };\n    const rootStyle = Object.assign({\n      position:'relative', minHeight:'100vh',\n      background: dark ? '#0a0215' : '#F5F2ED'\n    }, vars);\n\n    const opts = ['UAE','India','Australia','Singapore','Open to Any Location'];\n    const base = 'cursor:pointer;font-family:inherit;font-size:12px;padding:7px 14px;border-radius:20px;transition:all .15s;';\n    const relocateOptions = opts.map(label => {\n      const on = this.state.relocate.includes(label);\n      return {\n        label,\n        toggle: () => this.toggle(label),\n        style: base + (on\n          ? 'color:#0a0215;background:' + vars['--accent'] + ';border:0.5px solid ' + vars['--accent'] + ';'\n          : 'color:' + vars['--text2'] + ';background:transparent;border:0.5px solid ' + vars['--border'] + ';')\n      };\n    });\n\n    return {\n      rootStyle,\n      canvasRef: (el) => { this.canvas = el; },\n      canvasStyle: {\n        position:'fixed', inset:0, width:'100%', height:'100%', zIndex:0,\n        pointerEvents:'none', opacity:0.85, display: dark ? 'block' : 'none'\n      },\n      themeLabel: dark ? 'Light mode' : 'Dark mode',\n      toggleTheme: () => this.toggleTheme(),\n      modalOpen: this.state.modalOpen,\n      submitted: this.state.submitted,\n      error: this.state.error,\n      notSubmitted: !this.state.submitted,\n      open: () => this.open(),\n      close: () => this.close(),\n      stop: (e) => e.stopPropagation(),\n      submit: (e) => this.submit(e),\n      relocateOptions,\n      overlayStyle: {\n        position:'fixed', inset:0, zIndex:100,\n        display: this.state.modalOpen ? 'flex' : 'none',\n        alignItems:'center', justifyContent:'center',\n        background:'rgba(0,0,0,0.8)', padding:'24px'\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
